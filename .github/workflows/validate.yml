name: Validate project
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test frontend adapter without external services
        run: python -m unittest discover -s frontend -p 'test_*.py' -v
      - name: Validate portable workflow package
        run: python scripts/validate_repository.py
