services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.40.5
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      TZ: Europe/Berlin
      GENERIC_TIMEZONE: Europe/Berlin
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
    volumes:
      - n8n_data:/home/node/.n8n
    mem_limit: 2g
volumes:
  n8n_data:

